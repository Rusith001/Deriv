<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Volatility Signal Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #00ff88;
    --red:   #ff3355;
    --amber: #ffcc00;
    --bg:    #050a0e;
    --bg2:   #0a1520;
    --bdr:   #1a3a55;
    --text:  #c8e8ff;
    --dim:   #5a8aaa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 32px 16px;
    background-image:
      radial-gradient(ellipse at 20% 10%, #00203a55 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #001a2e55 0%, transparent 50%);
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* HEADER */
  header { text-align: center; }

  .badge {
    display: inline-block;
    border: 1px solid var(--green);
    border-radius: 4px;
    padding: 3px 16px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 12px;
    box-shadow: 0 0 12px #00ff8855;
  }

  h1 {
    font-size: clamp(26px, 6vw, 46px);
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    text-shadow: 0 0 40px #00ff8840;
  }
  h1 em { color: var(--green); font-style: normal; }

  /* CLOCK */
  .clock-box {
    background: var(--bg2);
    border: 1px solid var(--bdr);
    border-radius: 10px;
    padding: 12px 44px;
    text-align: center;
  }
  .clock-lbl {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #sl-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(36px, 8vw, 58px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 5px;
    text-shadow: 0 0 18px #ffcc0077;
    line-height: 1;
  }

  /* CARD WRAPPER */
  #card-wrap {
    width: 100%;
    max-width: 400px;
    min-height: 310px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CARD */
  .card {
    width: 100%;
    background: var(--bg2);
    border: 2px solid var(--bdr);
    border-radius: 18px;
    padding: 30px 24px 26px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
    animation: popIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    transition: border-color 0.4s, box-shadow 0.4s;
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    border-radius: 18px 18px 0 0;
  }
  .card.call::after { background: var(--green); box-shadow: 0 0 20px #00ff8899; }
  .card.put::after  { background: var(--red);   box-shadow: 0 0 20px #ff335599; }

  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.82) translateY(24px); }
    100% { opacity: 1; transform: scale(1)    translateY(0); }
  }

  /* PAIR NAME */
  .c-pair {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }
  .c-pair-name {
    font-size: clamp(16px, 3.5vw, 20px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 1.4s ease infinite;
  }
  .call .dot { background: var(--green); box-shadow: 0 0 10px #00ff88; }
  .put  .dot { background: var(--red);   box-shadow: 0 0 10px #ff3355; }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.3; transform:scale(.5); }
  }

  /* DIRECTION BADGE */
  .c-dir {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 5px 22px;
    border-radius: 5px;
    margin-top: -6px;
  }
  .call .c-dir { background:#00ff8818; color:var(--green); border:1px solid #00ff8845; }
  .put  .c-dir { background:#ff335518; color:var(--red);   border:1px solid #ff335545; }

  /* TIME */
  .c-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(68px, 17vw, 104px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 4px;
  }
  .card.call .c-time { color: var(--green); text-shadow: 0 0 30px #00ff8899; }
  .card.put  .c-time { color: var(--red);   text-shadow: 0 0 30px #ff335599; }

  .c-time-lbl {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: -10px;
  }

  /* RUNS */
  .c-runs {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(38px, 9vw, 56px);
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 16px #ffcc0066;
    letter-spacing: 2px;
    line-height: 1;
  }
  .c-runs-lbl {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: -8px;
  }

  /* COUNTDOWN */
  .c-cd {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  .entry-now {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 6px 20px;
    border-radius: 4px;
    text-transform: uppercase;
    animation: blink 0.5s step-end infinite;
  }
  .call .entry-now { background:#00ff8820; color:var(--green); border:1px solid #00ff8855; }
  .put  .entry-now { background:#ff335520; color:var(--red);   border:1px solid #ff335555; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.1} }

  /* EMPTY */
  .empty {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 1px;
    line-height: 2.6;
    text-align: center;
  }
  .empty b { color: var(--green); }

  /* BUTTON */
  #genBtn {
    cursor: pointer;
    border: none; outline: none;
    background: var(--green);
    color: #001a0f;
    font-family: 'Exo 2', sans-serif;
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 22px 72px;
    border-radius: 8px;
    box-shadow: 0 0 28px #00ff8888, 0 0 70px #00ff8833;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  #genBtn:hover  { transform: translateY(-3px); box-shadow: 0 0 44px #00ff88bb, 0 0 90px #00ff8855; }
  #genBtn:active { transform: scale(0.96); }
  #genBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  footer {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    text-align: center;
    line-height: 2;
  }
</style>
</head>
<body>

<header>
  <div class="badge">⚡ Signal Engine</div>
  <h1>Deriv <em>Volatility</em><br>Signal Generator</h1>
</header>

<div class="clock-box">
  <div class="clock-lbl">🇱🇰 Sri Lanka Time</div>
  <div id="sl-time">--:--</div>
</div>

<div id="card-wrap">
  <div class="empty">Press <b>GENERATE</b><br>to get your signal</div>
</div>

<button id="genBtn" onclick="generate()">⚡ GENERATE</button>

<footer>
  Randomly generated · Not financial advice · Trade responsibly
</footer>

<script>
  const PAIRS = [
    'Volatility 10 Index',
    'Volatility 10 (1s) Index',
    'Volatility 25 Index',
    'Volatility 25 (1s) Index',
    'Volatility 50 Index',
    'Volatility 50 (1s) Index',
    'Volatility 75 Index',
    'Volatility 75 (1s) Index',
    'Volatility 100 Index',
    'Volatility 100 (1s) Index',
  ];

  let activeTimer = null;

  function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function pad(n)     { return String(n).padStart(2, '0'); }

  function getSL() {
    const now = new Date();
    return new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 5.5 * 3600000);
  }

  function updateClock() {
    const d = getSL();
    document.getElementById('sl-time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  updateClock();
  setInterval(updateClock, 1000);

  function generate() {
    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Generating...';

    if (activeTimer) { clearInterval(activeTimer); activeTimer = null; }

    setTimeout(() => {
      const sl         = getSL();
      const offsetSec  = rand(60, 180);
      const entryDate  = new Date(sl.getTime() + offsetSec * 1000);
      const pair       = PAIRS[rand(0, PAIRS.length - 1)];
      const dir        = Math.random() > 0.5 ? 'call' : 'put';
      const hhmm       = pad(entryDate.getHours()) + ':' + pad(entryDate.getMinutes());
      const runs       = rand(8, 12);
      const dirLabel   = dir === 'call' ? '▲ CALL' : '▼ PUT';

      const wrap = document.getElementById('card-wrap');
      wrap.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'card ' + dir;
      card.innerHTML = `
        <div class="c-pair">
          <span class="dot"></span>
          <span class="c-pair-name">${pair}</span>
        </div>
        <div class="c-dir">${dirLabel}</div>
        <div>
          <div class="c-time">${hhmm}</div>
          <div class="c-time-lbl">Entry Time · Sri Lanka</div>
        </div>
        <div>
          <div class="c-runs">${runs}&times;</div>
          <div class="c-runs-lbl">Runs</div>
        </div>
        <div class="c-cd" id="cd">calculating...</div>
      `;

      wrap.appendChild(card);
      btn.disabled = false;
      btn.textContent = '⚡ GENERATE';

      const tick = () => {
        const el = document.getElementById('cd');
        if (!el) { clearInterval(activeTimer); return; }
        const diff = Math.max(0, Math.floor((entryDate - getSL()) / 1000));
        if (diff === 0) {
          clearInterval(activeTimer);
          el.outerHTML = `<div class="entry-now">⚡ ENTRY NOW</div>`;
          card.style.borderColor = dir === 'call' ? '#00ff88' : '#ff3355';
          card.style.boxShadow   = dir === 'call' ? '0 0 36px #00ff8866' : '0 0 36px #ff335566';
          setTimeout(() => { card.style.borderColor = ''; card.style.boxShadow = ''; }, 6000);
        } else {
          const m = Math.floor(diff / 60), s = diff % 60;
          el.textContent = m + 'm ' + pad(s) + 's to entry';
        }
      };

      tick();
      activeTimer = setInterval(tick, 1000);
    }, 500);
  }
</script>
</body>
</html>
